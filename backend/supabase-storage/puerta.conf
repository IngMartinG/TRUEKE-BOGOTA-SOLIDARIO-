# Puerta de entrada del Storage local, como la de un proyecto de Supabase: la API de Storage queda bajo /storage/v1 y
# responde con CORS (el navegador sube las fotos directo, con la URL firmada, desde otro origen). En Supabase esto lo hace
# su gateway; aquí, un nginx delante del contenedor supabase/storage-api. Solo para desarrollo y pruebas.
server {
    listen 8082;
    server_tokens off;
    client_max_body_size 6m; # el bucket rechaza más de 5 MB con su propio error

    location /storage/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-upsert, cache-control, x-client-info";
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://storage:5000/;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
