# Entorno completo local: Front + API + SQL Server + Redis.
#   1) cp .env.example .env   y completa los valores
#   2) docker compose up --build
#   3) Front en http://localhost:8081 (sirve también /api y /hubs: mismo origen, sin CORS)
#      API directa en http://localhost:8080  (health: /health/ready)
# Los puertos se publican SOLO en este equipo (127.0.0.1), no en la red local.
# SQL Server y Redis NO se publican al host: solo la API los ve por la red interna.
# La API entra a SQL Server con su propio usuario (trueke_app, dueño solo de TruekeDb), no con "sa".
# Por defecto corre en "Local" (permite correo y pagos simulados; cualquier otro entorno exige la configuración real). Con ASPNETCORE_ENVIRONMENT=Production
# la API exige TODOS los servicios reales (SMTP, Wompi, Azure Blob, Urls__Frontend https) o no arranca.

name: trueke

services:
  api:
    build: .
    image: trueke-api:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Local}
      ConnectionStrings__TruekeDb: "Server=sqlserver,1433;Database=TruekeDb;User Id=trueke_app;Password=${SQL_APP_PASSWORD:?Define SQL_APP_PASSWORD en .env};TrustServerCertificate=True;Encrypt=True"
      Database__Provider: SqlServer
      Database__Inicializacion: Migrate
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Pagos__Proveedor: ${PAGOS_PROVEEDOR:-Simulado}
      Pagos__Wompi__BaseUrl: ${WOMPI_BASE_URL:-https://sandbox.wompi.co/v1}
      Pagos__Wompi__LlavePublica: ${WOMPI_LLAVE_PUBLICA:-}
      Pagos__Wompi__LlavePrivada: ${WOMPI_LLAVE_PRIVADA:-}
      Pagos__Wompi__SecretoIntegridad: ${WOMPI_SECRETO_INTEGRIDAD:-}
      Pagos__Wompi__SecretoEventos: ${WOMPI_SECRETO_EVENTOS:-}
      Correo__Proveedor: ${CORREO_PROVEEDOR:-Simulado}
      Correo__Remitente: ${CORREO_REMITENTE:-no-responder@trueke.co}
      Correo__Smtp__Host: ${SMTP_HOST:-}
      Correo__Smtp__Puerto: ${SMTP_PUERTO:-587}
      Correo__Smtp__Usuario: ${SMTP_USUARIO:-}
      Correo__Smtp__Clave: ${SMTP_CLAVE:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Captcha__ClaveSitio: ${CAPTCHA_CLAVE_SITIO:-}
      Captcha__ClaveSecreta: ${CAPTCHA_CLAVE_SECRETA:-}
      Seguridad__ClaveCifrado: ${CLAVE_CIFRADO:?Define CLAVE_CIFRADO en .env}
      Seguridad__ExigirDosFactoresModeradores: ${EXIGIR_2FA_ADMIN:-true}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      Almacenamiento__CadenaConexion: ${ALMACENAMIENTO_CADENA:-}
      Almacenamiento__ServicioUrl: ${ALMACENAMIENTO_URL:-}
      Urls__Frontend: ${URL_FRONTEND:-http://localhost:8081}
      Redis__Habilitado: "true"
      Redis__Conexion: "redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env},abortConnect=false"
      Cors__Origenes__0: ${CORS_ORIGEN:-http://localhost:4200}
      Auth__CookieSameSite: ${COOKIE_SAMESITE:-Strict}
      Bootstrap__SuperUsuarioCorreo: ${SUPERUSUARIO_CORREO:-}
      Bootstrap__SuperUsuarioClave: ${SUPERUSUARIO_CLAVE:-}
      Facturacion__Modo: ${FACTURACION_MODO:-Manual}
      Facturacion__ResponsableIva: ${FACTURACION_RESPONSABLE_IVA:-true}
      Facturacion__IvaPorcentaje: ${FACTURACION_IVA:-19}
      Legal__CorreoContacto: ${CORREO_CONTACTO:-}
    depends_on:
      sql-usuario:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build: ../frontend
    image: trueke-web:local
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # Vacío = la API se usa en el mismo origen a través del proxy de nginx (recomendado).
      API_URL: ${WEB_API_URL:-}
      API_UPSTREAM: http://api:8080
      # Hosts de Azure Blob para fotos (img-src) y subidas directas con SAS (connect-src).
      CSP_IMG_EXTRA: ${WEB_CSP_IMG_EXTRA:-}
      CSP_CONNECT_EXTRA: ${WEB_CSP_CONNECT_EXTRA:-}
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Define SQL_SA_PASSWORD en .env}
      MSSQL_PID: Developer
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Crea la base, el usuario de la aplicación (trueke_app, db_owner SOLO de TruekeDb: puede migrar su esquema pero no
  # administrar el servidor) y le pone la clave de .env. Corre una vez en cada arranque y termina.
  sql-usuario:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        clave=$${SQL_APP_PASSWORD//\'/\'\'}   # comillas simples duplicadas para el literal de T-SQL
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "
          IF DB_ID('TruekeDb') IS NULL CREATE DATABASE TruekeDb;
          IF SUSER_ID('trueke_app') IS NULL CREATE LOGIN trueke_app WITH PASSWORD = N'$$clave', CHECK_POLICY = ON;
          ELSE ALTER LOGIN trueke_app WITH PASSWORD = N'$$clave';"
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d TruekeDb -Q "
          IF USER_ID('trueke_app') IS NULL CREATE USER trueke_app FOR LOGIN trueke_app;
          ALTER ROLE db_owner ADD MEMBER trueke_app;"
        echo "Usuario trueke_app listo"
    environment:
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Define SQL_SA_PASSWORD en .env}
      SQL_APP_PASSWORD: ${SQL_APP_PASSWORD:?Define SQL_APP_PASSWORD en .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # La clave va a un archivo de configuración en memoria (no en los argumentos del proceso, que ve cualquiera con "ps").
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'requirepass %s\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

volumes:
  sqldata:
