# Entorno completo local: Front + API + PostgreSQL + Redis.
#   1) cp .env.example .env   y completa los valores
#   2) docker compose up --build
#   3) Front en http://localhost:8081 (sirve también /api y /hubs: mismo origen, sin CORS)
#      API directa en http://localhost:8080  (health: /health/ready)
# Los puertos se publican SOLO en este equipo (127.0.0.1), no en la red local.
# PostgreSQL y Redis NO se publican al host: solo la API los ve por la red interna.
# La API entra a PostgreSQL con su propio usuario (trueke_app, dueño solo de la base trueke), no con el superusuario "postgres".
# Por defecto corre en "Local" (permite correo y pagos simulados; cualquier otro entorno exige la configuración real). Con ASPNETCORE_ENVIRONMENT=Production
# la API exige TODOS los servicios reales (SMTP, Wompi, Supabase Storage, Urls__Frontend https) o no arranca.

name: trueke

services:
  api:
    build: .
    image: trueke-api:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Local}
      ConnectionStrings__TruekeDb: "Host=postgres;Port=5432;Database=trueke;Username=trueke_app;Password=${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}"
      Database__Provider: PostgreSQL
      Database__Inicializacion: Migrate
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Pagos__Proveedor: ${PAGOS_PROVEEDOR:-Simulado}
      Pagos__VentasHabilitadas: ${PAGOS_VENTAS_HABILITADAS:-true}
      Donaciones__Url: ${DONACIONES_URL:-}
      Pagos__Wompi__BaseUrl: ${WOMPI_BASE_URL:-https://sandbox.wompi.co/v1}
      Pagos__Wompi__LlavePublica: ${WOMPI_LLAVE_PUBLICA:-}
      Pagos__Wompi__LlavePrivada: ${WOMPI_LLAVE_PRIVADA:-}
      Pagos__Wompi__SecretoIntegridad: ${WOMPI_SECRETO_INTEGRIDAD:-}
      Pagos__Wompi__SecretoEventos: ${WOMPI_SECRETO_EVENTOS:-}
      Correo__Proveedor: ${CORREO_PROVEEDOR:-Simulado}
      Correo__Remitente: ${CORREO_REMITENTE:-no-responder@trueke.co}
      Correo__Brevo__ClaveApi: ${BREVO_CLAVE_API:-}
      Correo__Smtp__Host: ${SMTP_HOST:-}
      Correo__Smtp__Puerto: ${SMTP_PUERTO:-587}
      Correo__Smtp__Usuario: ${SMTP_USUARIO:-}
      Correo__Smtp__Clave: ${SMTP_CLAVE:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Captcha__ClaveSitio: ${CAPTCHA_CLAVE_SITIO:-}
      Captcha__ClaveSecreta: ${CAPTCHA_CLAVE_SECRETA:-}
      Seguridad__ClaveCifrado: ${CLAVE_CIFRADO:?Define CLAVE_CIFRADO en .env}
      Seguridad__ExigirDosFactoresModeradores: ${EXIGIR_2FA_ADMIN:-true}
      Almacenamiento__Url: ${ALMACENAMIENTO_URL:-}
      Almacenamiento__LlaveServicio: ${ALMACENAMIENTO_LLAVE:-}
      Urls__Frontend: ${URL_FRONTEND:-http://localhost:8081}
      Redis__Habilitado: "true"
      Redis__Conexion: "redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env},abortConnect=false"
      Cors__Origenes__0: ${CORS_ORIGEN:-http://localhost:4200}
      Auth__CookieSameSite: ${COOKIE_SAMESITE:-Strict}
      Bootstrap__SuperUsuarioCorreo: ${SUPERUSUARIO_CORREO:-}
      Bootstrap__SuperUsuarioClave: ${SUPERUSUARIO_CLAVE:-}
      Facturacion__Modo: ${FACTURACION_MODO:-Manual}
      Facturacion__ResponsableIva: ${FACTURACION_RESPONSABLE_IVA:-true}
      Facturacion__IvaPorcentaje: ${FACTURACION_IVA:-19}
      Legal__CorreoContacto: ${CORREO_CONTACTO:-}
      Legal__ResponsableNombre: ${LEGAL_RESPONSABLE:-}
      Legal__Domicilio: ${LEGAL_DOMICILIO:-}
      Legal__Telefono: ${LEGAL_TELEFONO:-}
    depends_on:
      db-usuario:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build: ../frontend
    image: trueke-web:local
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # Vacío = la API se usa en el mismo origen a través del proxy de nginx (recomendado).
      API_URL: ${WEB_API_URL:-}
      API_UPSTREAM: http://api:8080
      # Origen de Supabase Storage para fotos (img-src) y subidas directas con URL firmada (connect-src).
      CSP_IMG_EXTRA: ${WEB_CSP_IMG_EXTRA:-}
      CSP_CONNECT_EXTRA: ${WEB_CSP_CONNECT_EXTRA:-}
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Crea el usuario de la aplicación (trueke_app) y la base "trueke" con él como dueño: puede migrar su esquema pero
  # no administrar el servidor ni ver otras bases. Le pone la clave de .env. Corre una vez en cada arranque y termina.
  db-usuario:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # La clave viaja como variable de psql (:'clave' la cita como literal): no se arma SQL concatenando texto.
        psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -v clave="$$DB_APP_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE trueke_app' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'trueke_app') \gexec
        ALTER ROLE trueke_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'clave';
        SELECT 'CREATE DATABASE trueke OWNER trueke_app' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'trueke') \gexec
        REVOKE ALL ON DATABASE trueke FROM PUBLIC;
        SQL
        echo "Usuario trueke_app listo"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # La clave va a un archivo de configuración en memoria (no en los argumentos del proceso, que ve cualquiera con "ps").
    # Corre con el usuario redis (sin root) y sin escribir a disco: es solo caché y backplane de SignalR.
    user: redis
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'requirepass %s\nappendonly no\nsave ""\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
