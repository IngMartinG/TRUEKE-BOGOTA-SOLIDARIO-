# Ambiente de pruebas de punta a punta (Playwright). Se suma a backend/docker-compose.yml:
#   docker compose -p trueke-e2e --project-directory ../backend -f ../backend/docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build
# (lo hace solo `npm run e2e`). Nada de esto se despliega: la app es la MISMA imagen de producción (API + front con nginx,
# PostgreSQL con migraciones, Redis). Solo se reemplazan los servicios externos:
#   - Brevo → Mailpit, por SMTP con STARTTLS real (certificado de una CA creada aquí, que solo
#     confía el contenedor de la API).
#   - Supabase Storage → el mismo servidor que corre Supabase (supabase/storage-api, archivos en memoria) detrás de una
#     "puerta" nginx que, como el gateway de Supabase, lo publica bajo /storage/v1 con CORS. La puerta escucha en 127.0.0.2
#     DENTRO del contenedor de la API (comparte su red) y se publica en el equipo: así las URLs de las fotos son de
#     loopback (las únicas http que acepta la API) y el navegador las alcanza. Llaves de DEMOSTRACIÓN de Supabase (ver
#     backend/docker-compose.storage.yml): no son secretos.
#   - Wompi → pagos simulados (ya es el valor por defecto del compose en el entorno Local).

services:
  # CA de un solo uso: emite el certificado de Mailpit y publica su lista de revocación (CRL) por HTTP, como una CA
  # real. La API valida la cadena Y la revocación (MailKit lo exige): no se desactiva ninguna verificación.
  certificados:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl busybox-extras >/dev/null
        cd /certs
        rm -rf ./*
        mkdir -p ca publico confianza
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Trueke E2E CA" -keyout ca/ca.key -out ca.crt \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj "/CN=mailpit" -keyout mailpit.key -out ca/mailpit.csr 2>/dev/null
        printf "subjectAltName=DNS:mailpit\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\ncrlDistributionPoints=URI:http://certificados/ca.crl\n" > ca/ext.cnf
        openssl x509 -req -in ca/mailpit.csr -CA ca.crt -CAkey ca/ca.key -CAcreateserial -days 2 -out mailpit.crt -extfile ca/ext.cnf 2>/dev/null
        # Lista de revocación vacía y firmada por la CA (formato DER, como la publican las CA)
        touch ca/index.txt && echo 01 > ca/crlnumber
        printf "[ca]\ndefault_ca=local\n[local]\ndatabase=/certs/ca/index.txt\ncrlnumber=/certs/ca/crlnumber\ndefault_md=sha256\ndefault_crl_days=2\n" > ca/ca.cnf
        openssl ca -config ca/ca.cnf -gencrl -keyfile ca/ca.key -cert ca.crt -out ca/ca.crl.pem 2>/dev/null
        openssl crl -in ca/ca.crl.pem -outform DER -out publico/ca.crl
        rm -rf ca
        cp ca.crt confianza/ && openssl rehash confianza
        chmod -R a+rX /certs
        touch /tmp/listo
        exec httpd -f -p 80 -h /certs/publico
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/listo"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - certs:/certs

  mailpit:
    image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:8025:8025" # API HTTP de Mailpit (solo en este equipo): las pruebas leen ahí los correos
    volumes:
      - certs:/certs:ro
    depends_on:
      certificados:
        condition: service_healthy

  storage-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: storage-e2e
      POSTGRES_DB: storage
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage"]
      interval: 2s
      timeout: 2s
      retries: 30

  storage:
    image: supabase/storage-api:v1.83.1@sha256:e934d761d33e28b0ed79143dac773145fc8036ae58102124f30ebe8053d4fc3b
    environment:
      AUTH_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      DATABASE_URL: postgres://postgres:storage-e2e@storage-db:5432/storage
      DB_INSTALL_ROLES: "true"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /tmp/storage
      FILE_SIZE_LIMIT: "52428800"
      TENANT_ID: e2e
      REGION: local
      GLOBAL_S3_BUCKET: e2e
    tmpfs:
      - /tmp
    depends_on:
      storage-db:
        condition: service_healthy

  puerta-storage:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    network_mode: "service:api"
    volumes:
      - ./supabase-storage/puerta.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storage

  api:
    ports:
      - "8082:8082" # Puerta de Storage (comparte la red de la API)
    environment:
      Correo__Proveedor: Smtp
      Correo__Smtp__Host: mailpit
      Correo__Smtp__Puerto: "1025"
      Correo__Smtp__Seguridad: StartTls
      Correo__Smtp__Usuario: ""
      # Solo la CA de este ambiente: la API no necesita confiar en nada más aquí.
      SSL_CERT_DIR: /certs/confianza
      Almacenamiento__Url: http://127.0.0.2:8082/storage/v1
      Almacenamiento__LlaveServicio: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      Urls__Frontend: http://localhost:8081
      # Notificaciones push con llaves VAPID de un solo uso (las genera e2e/ambiente.ts)
      Push__ClavePublica: ${E2E_PUSH_PUBLICA:-}
      Push__ClavePrivada: ${E2E_PUSH_PRIVADA:-}
      # Varias cuentas desde la misma IP en pocos segundos: límites más altos que en producción.
      RateLimiting__AuthPorMinuto: "300"
      RateLimiting__EscrituraPorMinuto: "300"
      RateLimiting__PqrPublicaPorMinuto: "300"
      RateLimiting__PqrPublicaPorHora: "3000"
      RateLimiting__GlobalPorMinuto: "5000"
    volumes:
      - certs:/certs:ro
    depends_on:
      mailpit:
        condition: service_started

  web:
    environment:
      CSP_IMG_EXTRA: http://127.0.0.2:8082
      CSP_CONNECT_EXTRA: http://127.0.0.2:8082

volumes:
  certs:
