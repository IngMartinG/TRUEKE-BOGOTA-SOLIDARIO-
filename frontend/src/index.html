<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Trueke Bogotá Solidario · Intercambia, compra y dona</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Plataforma comunitaria de economía circular en Colombia: intercambia, compra de segunda mano y dona objetos con personas de tu ciudad. Gana Eco-Puntos por cada intercambio."
    />
    <meta name="theme-color" content="#123d27" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Verificación de la propiedad en Google Search Console (pública por diseño; permite enviar el sitemap) -->
    <meta name="google-site-verification" content="4IBXDpQ2F5dOF0PMUxTk6QlMt_GkEOkNPil_xMf-B_4" />
    <!-- Vista previa al compartir. WhatsApp y Facebook exigen URLs ABSOLUTAS: el despliegue reemplaza "og-imagen.png"
         y "og:url" por la URL pública (ver .github/workflows/frontend-pages.yml). Cada publicación tiene la suya en la API
         (/compartir/publicaciones/{id}) porque esta SPA no puede cambiar estas etiquetas para los robots. -->
    <meta property="og:site_name" content="Trueke Bogotá Solidario" />
    <meta property="og:title" content="Trueke Bogotá Solidario" />
    <meta property="og:description" content="Intercambia, compra y dona en tu ciudad. Economía circular hecha comunidad." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="og-imagen.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Trueke Bogotá Solidario" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icono-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Aplica el modo oscuro antes de pintar (evita el destello claro); luego TemaService toma el control -->
    <script>try{var t=localStorage.getItem('trueke.tema');if(t==='oscuro'||(t!=='claro'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <style>
      .carga{min-height:100vh;display:grid;place-items:center;background:#f6f4ec}
      html.dark .carga{background:#0b1611}
      html.dark .carga img{background:#f6f4ec;border-radius:1.5rem;padding:.75rem}
      /* La app espera la configuración de la API antes de arrancar. En el plan gratis la API se duerme y la primera
         visita tarda hasta un minuto: si la carga pasa de 4 s, se explica por qué. Solo CSS (sin JS ni animación). */
      .carga>div{display:grid;justify-items:center;gap:1.25rem;padding:0 1rem}
      .carga p{margin:0;max-width:22rem;text-align:center;font:500 .95rem/1.5 system-ui,sans-serif;color:#2f4a3b;visibility:hidden;animation:mostrar-aviso 0s 4s forwards}
      html.dark .carga p{color:#d7e4dc}
      @keyframes mostrar-aviso{to{visibility:visible}}
    </style>
  </head>
  <body>
    <app-root>
      <div class="carga">
        <div>
          <picture>
            <source srcset="logo-carga.webp" type="image/webp" />
            <img src="logo-completo.png" width="168" height="140" alt="Cargando Trueke Bogotá Solidario" fetchpriority="high" />
          </picture>
          <p role="status">Estamos despertando el servidor. La primera visita puede tardar hasta un minuto.</p>
        </div>
      </div>
    </app-root>
    <noscript>Trueke Bogotá Solidario necesita JavaScript para funcionar.</noscript>
  </body>
</html>
