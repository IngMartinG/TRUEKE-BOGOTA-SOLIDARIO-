# Blueprint de Render: la API de Trueke Bogotá Solidario como contenedor Docker (fase gratuita).
# Guía paso a paso (cuentas, llaves y cómo pasar a pago): docs/DESPLIEGUE.md
#
# Render construye backend/Dockerfile en cada merge a main, pero solo después de que pasen los checks de GitHub (CI/CD).
# Los valores marcados con "sync: false" son SECRETOS: Render los pide al crear el Blueprint y se guardan solo en su panel,
# nunca en este repositorio. Si falta alguno obligatorio, la API no arranca (fail-fast de Program.cs) y Render lo muestra en los logs.
services:
  - type: web
    name: trueke-api
    runtime: docker
    plan: free # Gratis: se duerme a los 15 min sin tráfico y tarda ~30-60 s en despertar. Pasar a pago: plan "starter".
    region: ohio # cerca de la base en Supabase (East US, Norte de Virginia). No se puede cambiar después de crear el servicio.
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: checksPass
    # Liveness (no toca la base): si Supabase pausó el proyecto por inactividad, la API sigue viva y lo muestra en /health/ready.
    healthCheckPath: /health/live
    envVars:
      # ---------- Fijos (no son secretos) ----------
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT # puerto en el que escucha el contenedor (ASPNETCORE_HTTP_PORTS=8080 en el Dockerfile)
        value: "8080"
      - key: Database__Inicializacion # aplica las migraciones de EF Core al arrancar
        value: Migrate
      - key: Redis__Habilitado # una sola instancia: no hace falta backplane. Con varias instancias, encender Redis.
        value: "false"
      # Render solo es alcanzable a través de su proxy, que agrega la IP real del cliente en X-Forwarded-For
      # (el límite de intentos de login se calcula por IP; sin esto, todos compartirían la IP del proxy).
      - key: Proxy__Confiar
        value: "true"
      # El front (github.io) y la API (onrender.com) están en sitios distintos: la cookie de sesión debe ser SameSite=None
      # (sigue siendo HttpOnly + Secure, y refrescar/salir exigen la cabecera anti-CSRF). Con dominio propio, volver a Strict.
      - key: Auth__CookieSameSite
        value: None
      - key: Cors__Origenes__0
        value: https://ingmarting.github.io
      - key: Urls__Frontend
        value: https://ingmarting.github.io/TRUEKE-BOGOTA-SOLIDARIO-/
      # URL pública de esta API: la vista previa al compartir (WhatsApp) necesita la imagen con URL absoluta.
      - key: Urls__Api
        value: https://trueke-api-yqbj.onrender.com
      - key: Pagos__Proveedor
        value: Wompi
      # Lanzamiento sin cobro: ningún pago con dinero (solo lo que cubren los Eco-Puntos). "true" para empezar a cobrar.
      - key: Pagos__VentasHabilitadas
        value: "false"
      - key: Pagos__Wompi__BaseUrl # sandbox mientras Wompi no apruebe el comercio; luego https://production.wompi.co/v1
        value: https://sandbox.wompi.co/v1
      - key: Facturacion__Modo
        value: Manual
      # Render gratis bloquea los puertos SMTP (25, 465 y 587): el correo sale por la API HTTPS de Brevo (300 al día gratis).
      # En un plan pago se puede volver a "Smtp" (Gmail u otro) con las variables Correo__Smtp__*.
      - key: Correo__Proveedor
        value: Brevo

      # ---------- Generados por Render (256 bits aleatorios en base64) ----------
      - key: Jwt__Key
        generateValue: true
      - key: Seguridad__ClaveCifrado # cifra los secretos de 2FA: si se cambia, quien tenga 2FA debe volver a activarlo
        generateValue: true

      # ---------- Secretos: se escriben en el panel de Render ----------
      # PostgreSQL de Supabase por el Session pooler (IPv4, puerto 5432): la conexión directa db.<ref>.supabase.co solo
      # tiene IPv6 y Render no la alcanza. Formato: Host=aws-N-<region>.pooler.supabase.com;Port=5432;Database=postgres;
      # Username=postgres.<ref>;Password=<clave>;SSL Mode=Require;Maximum Pool Size=10 (el plan gratis permite pocas conexiones
      # en modo sesión; docs/DESPLIEGUE.md §2). No usar el Transaction pooler
      # (6543): no conserva la sesión entre consultas y habría que agregar No Reset On Close=true y evitar sentencias preparadas.
      - key: ConnectionStrings__TruekeDb
        sync: false
      # Supabase Storage (fotos y documentos; docs/DESPLIEGUE.md §3): https://<ref>.supabase.co/storage/v1 y la llave
      # secreta del proyecto (Project Settings → API Keys → Secret key, sb_secret_…). Los buckets los crea la API sola.
      - key: Almacenamiento__Url
        sync: false
      - key: Almacenamiento__LlaveServicio
        sync: false
      - key: Urls__HostsPermitidosImagenes__0 # <ref>.supabase.co
        sync: false
      - key: Urls__HostsPermitidosDocumentos__0 # <ref>.supabase.co
        sync: false
      - key: Captcha__ClaveSitio
        sync: false
      - key: Captcha__ClaveSecreta
        sync: false
      - key: Correo__Brevo__ClaveApi # Brevo → SMTP & API → API Keys (xkeysib-…; docs/DESPLIEGUE.md §5.1). Sin ella, la API no arranca
        sync: false
      - key: Push__ClavePublica # notificaciones push: llaves VAPID (docs/DESPLIEGUE.md §6.2). Vacías = apagadas
        sync: false
      - key: Push__ClavePrivada
        sync: false
      - key: Correo__Remitente # con Brevo: un remitente verificado en Brevo → Senders (docs/DESPLIEGUE.md §5.1)
        sync: false
      - key: Correo__Smtp__Host # solo con Correo__Proveedor=Smtp (plan pago)
        sync: false
      - key: Correo__Smtp__Usuario
        sync: false
      - key: Correo__Smtp__Clave
        sync: false
      - key: Pagos__Wompi__LlavePublica
        sync: false
      - key: Pagos__Wompi__LlavePrivada
        sync: false
      - key: Pagos__Wompi__SecretoIntegridad
        sync: false
      - key: Pagos__Wompi__SecretoEventos
        sync: false
      - key: Donaciones__Url # opcional: enlace https de aportes voluntarios ("Apoya el proyecto"); vacío = no se muestra
        sync: false
      - key: Google__ClientId # opcional: botón "Continuar con Google"
        sync: false
      - key: Legal__CorreoContacto # obligatorio: atención de PQRS y contacto del responsable
        sync: false
      - key: Legal__ResponsableNombre # obligatorio: responsable del tratamiento (Ley 1581)
        sync: false
      - key: Legal__Domicilio # obligatorio: dirección de notificación y ciudad del responsable
        sync: false
      - key: Legal__ResponsableDocumento # opcional: cédula o NIT del responsable
        sync: false
      - key: Legal__Telefono # obligatorio: teléfono de contacto (puede ser una línea o un WhatsApp de la plataforma)
        sync: false
      - key: Bootstrap__SuperUsuarioCorreo # crea el SuperUsuario la primera vez; después se puede borrar
        sync: false
      - key: Bootstrap__SuperUsuarioClave
        sync: false
