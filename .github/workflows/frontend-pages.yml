name: Front en GitHub Pages

# Publica el front (Angular) en https://ingmarting.github.io/TRUEKE-BOGOTA-SOLIDARIO-/
# Requisito único: Settings → Pages → Source = "GitHub Actions".
# Pages no permite cabeceras propias (CSP, HSTS); el despliegue de producción con cabeceras
# sigue siendo la imagen Docker/nginx del front. Esta publicación es la demo pública.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-pages.yml"]
  workflow_dispatch:

# Mínimo privilegio: leer el repo y publicar en Pages (id-token lo exige deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso para no dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Build de producción para Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (exactas del lock)
        run: npm ci --no-audit --no-fund

      - name: Build con la subcarpeta del repositorio
        env:
          REPO: ${{ github.event.repository.name }}
        run: npx ng build --base-href "/${REPO}/"

      # URL de la API: variable del repositorio (Settings → Secrets and variables → Actions → Variables → API_URL),
      # p. ej. https://trueke-api.onrender.com. No es secreta (el navegador la ve). Tras cambiarla, re-ejecutar este
      # workflow (Actions → "Front en GitHub Pages" → Run workflow). Sin la variable se publica el config.json del repo.
      - name: Conectar con la API
        if: ${{ vars.API_URL != '' }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::API_URL debe empezar por https:// (valor actual: $API_URL)"; exit 1 ;;
          esac
          printf '{\n  "apiUrl": "%s"\n}\n' "${API_URL%/}" > dist/trueke-web/browser/config.json
          cat dist/trueke-web/browser/config.json

      # WhatsApp y Facebook no resuelven URLs relativas en og:image/og:url. URL pública: variable FRONT_URL del
      # repositorio (con dominio propio) o, por defecto, la de GitHub Pages (https://usuario.github.io/repositorio/).
      - name: URLs absolutas para la vista previa al compartir
        env:
          FRONT_URL: ${{ vars.FRONT_URL }}
          DUENO: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="${FRONT_URL:-https://${DUENO,,}.github.io/${REPO}/}"
          url="${url%/}/"
          case "$url" in https://*) ;; *) echo "::error::FRONT_URL debe empezar por https://"; exit 1 ;; esac
          index=dist/trueke-web/browser/index.html
          sed -i -e "s#<meta property=\"og:image\" content=\"og-imagen.png\"#<meta property=\"og:image\" content=\"${url}og-imagen.png\"#" \
                 -e "s#<meta property=\"og:url\" content=\"./\"#<meta property=\"og:url\" content=\"${url}\"#" "$index"
          grep -q "og:image\" content=\"${url}og-imagen.png\"" "$index" || { echo "::error::No se pudo fijar og:image"; exit 1; }
          grep -o '<meta property="og:\(url\|image\)" content="[^"]*"' "$index"

      # GitHub Pages no permite cabeceras propias: la Content-Security-Policy va en un <meta> (la misma política que
      # nginx, salvo frame-ancestors, que un <meta> no admite; contra iframes ajenos, main.ts no arranca la app).
      # Las fotos se suben y se leen de Supabase Storage: el origen del proyecto (variable del repo STORAGE_ORIGEN, p. ej.
      # https://abcd1234.supabase.co) o, si no está definida, cualquier proyecto de Supabase (*.supabase.co).
      - name: Content-Security-Policy
        env:
          API_URL: ${{ vars.API_URL }}
          STORAGE_ORIGEN: ${{ vars.STORAGE_ORIGEN }}
        run: |
          storage="https://*.supabase.co"
          if [ -n "$STORAGE_ORIGEN" ]; then
            storage=$(printf '%s' "$STORAGE_ORIGEN" | sed -E 's#^(https://[^/]+).*#\1#')
          fi
          api=""
          if [ -n "$API_URL" ]; then
            origen=$(printf '%s' "$API_URL" | sed -E 's#^(https://[^/]+).*#\1#')
            api="$origen $(printf '%s' "$origen" | sed 's#^https://#wss://#')"   # wss: SignalR
          fi
          index=dist/trueke-web/browser/index.html
          hashes=$(node scripts/csp-hash-inline.mjs "$index")   # el importmap de Angular (integridad de los chunks)
          csp="default-src 'self'; script-src 'self' ${hashes} https://accounts.google.com/gsi/client https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org ${storage} https://*.googleusercontent.com; font-src 'self'; connect-src 'self' ${api} ${storage} https://accounts.google.com/gsi/ https://www.google.com/recaptcha/; frame-src https://accounts.google.com/gsi/ https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
          sed -i -E "s#<meta charset=\"utf-8\" ?/?>#&\n    <meta http-equiv=\"Content-Security-Policy\" content=\"${csp}\">#" "$index"
          grep -q 'http-equiv="Content-Security-Policy"' "$index" || { echo "::error::No se pudo insertar la CSP"; exit 1; }
          grep -o '<meta http-equiv="Content-Security-Policy"[^>]*>' "$index"

      # index.html cambió después del build (og:, CSP): el service worker valida cada archivo con el SHA-1 de ngsw.json y,
      # si no coincide, no se instala. Se actualiza el hash.
      - name: Actualizar el hash de index.html en ngsw.json
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const dir = "dist/trueke-web/browser", ngsw = JSON.parse(fs.readFileSync(dir + "/ngsw.json", "utf8"));
            const sha1 = crypto.createHash("sha1").update(fs.readFileSync(dir + "/index.html")).digest("hex");
            const claves = Object.keys(ngsw.hashTable).filter((k) => k.endsWith("/index.html"));
            if (claves.length === 0) { console.error("ngsw.json sin index.html"); process.exit(1); }
            for (const k of claves) ngsw.hashTable[k] = sha1;
            fs.writeFileSync(dir + "/ngsw.json", JSON.stringify(ngsw, null, 2));
            console.log(claves.join(", "), "→", sha1);'

      - name: Fallback de la SPA y sin procesamiento Jekyll
        run: |
          cd dist/trueke-web/browser
          # Pages responde 404.html a cualquier ruta desconocida: así /explorar carga la app.
          cp index.html 404.html
          touch .nojekyll
          if find . -name '*.map' | grep -q .; then
            echo "::error::El build de producción contiene source maps."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/trueke-web/browser

  publicar:
    name: Publicar en GitHub Pages
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
