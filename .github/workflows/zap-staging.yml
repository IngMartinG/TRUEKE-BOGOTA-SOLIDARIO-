name: OWASP ZAP (escaneo del entorno de staging)

# Escaneo pasivo ("baseline") de la aplicación desplegada: cabeceras, cookies, CSP, fugas de información, etc.
# Se ejecuta a mano (Actions → OWASP ZAP → Run workflow) indicando la URL de STAGING. Nunca contra producción.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL https del front en staging (p. ej. https://staging.trueke.co)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # ZAP abre un issue con el resumen de alertas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validar la URL (nunca producción)
        env:
          URL_OBJETIVO: ${{ inputs.url }}
          API_PRODUCCION: ${{ vars.API_URL }}
          FRONT_PRODUCCION: ${{ vars.FRONT_URL }}
          DUENO: ${{ github.repository_owner }}
        run: |
          case "$URL_OBJETIVO" in
            https://*) ;;
            *) echo "::error::La URL debe empezar por https://"; exit 1 ;;
          esac
          host() { printf '%s' "$1" | sed -E 's#^https?://([^/:]+).*#\1#' | tr 'A-Z' 'a-z'; }
          objetivo=$(host "$URL_OBJETIVO")
          # Hosts de producción: los de las variables del repositorio y el de GitHub Pages del dueño.
          for prod in "$(host "$API_PRODUCCION")" "$(host "$FRONT_PRODUCCION")" "$(printf '%s' "$DUENO" | tr 'A-Z' 'a-z').github.io"; do
            if [ -n "$prod" ] && [ "$objetivo" = "$prod" ]; then
              echo "::error::$objetivo es producción. ZAP solo se ejecuta contra staging."; exit 1
            fi
          done
      - name: Escaneo baseline de ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.12.0 (Dependabot propone las versiones nuevas)
        with:
          target: ${{ inputs.url }}
          allow_issue_writing: true
          fail_action: false
